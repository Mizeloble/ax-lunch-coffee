<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b10" />
    <title>복불복</title>
    <style>
      /* JS·CSS가 도착하기 전에도 브랜드 배경이 즉시 칠해지도록 인라인으로.
         html만 칠하면 일부 웹뷰가 body를 흰색으로 그린다 — 둘 다 지정한다. */
      html, body { margin: 0; background: #0b0b10; }
      /* 부팅 스플래시: HTML만 파싱돼도 바로 보인다. React가 마운트하며 대체. */
      #boot {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      @keyframes boot-pulse { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-hidden="true">
        <svg width="56" height="56" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="11" fill="none" stroke="#ef4444" stroke-width="3"/>
          <circle cx="16" cy="16" r="6" fill="none" stroke="#fbbf24" stroke-width="3"/>
          <circle cx="16" cy="16" r="1.8" fill="#fbbf24"/>
        </svg>
      </div>
    </div>
  </body>
</html>

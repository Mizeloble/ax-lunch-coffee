<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  /* 앱인토스 게임 썸네일 1932×828 — 통합홈 피드에서 축소 노출되므로 큰 타이포 위주 */
  html,body{margin:0;padding:0}
  body{width:1932px;height:828px;overflow:hidden;position:relative;
    font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    background:
      radial-gradient(60% 80% at 78% 30%, rgba(251,191,36,.16), transparent 60%),
      radial-gradient(50% 70% at 12% 90%, rgba(239,68,68,.12), transparent 65%),
      radial-gradient(130% 100% at 50% 0%, #191922 0%, #0b0b10 62%) #0b0b10;
    color:#f5f5f5;letter-spacing:-0.03em}
  .wrap{position:absolute;inset:0;display:flex;align-items:center;gap:90px;padding:0 120px}
  .left{flex:1;min-width:0}
  h1{margin:0;font-size:150px;font-weight:800;line-height:1.06;letter-spacing:-0.05em}
  h1 .accent{color:#fbbf24}
  p.tag{margin:34px 0 0;font-size:52px;color:#c9c9d4;font-weight:600}
  .chips{display:flex;gap:22px;margin-top:52px}
  .chip{display:flex;align-items:center;gap:14px;padding:18px 34px;border-radius:999px;
    background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);
    font-size:38px;font-weight:700;color:#e8e8ef;white-space:nowrap}
  .art{position:relative;width:560px;height:560px;flex:none}
  .art svg.target{position:absolute;inset:0}
  .marble{position:absolute;border-radius:50%;
    box-shadow:inset -8px -10px 16px rgba(0,0,0,.35), inset 6px 8px 12px rgba(255,255,255,.25), 0 18px 30px rgba(0,0,0,.45)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <h1>복불복<span class="accent">파티</span></h1>
      <p class="tag">모여서 바로 즐기는 복불복 미니게임</p>
      <div class="chips">
        <span class="chip">🏁 마블 레이스</span>
        <span class="chip">⚡ 반응속도</span>
        <span class="chip">🧠 상식 퀴즈</span>
        <span class="chip">+5</span>
      </div>
    </div>
    <div class="art">
      <svg class="target" width="560" height="560" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="11" fill="none" stroke="#ef4444" stroke-width="3"/>
        <circle cx="16" cy="16" r="6" fill="none" stroke="#fbbf24" stroke-width="3"/>
        <circle cx="16" cy="16" r="1.8" fill="#fbbf24"/>
      </svg>
      <div class="marble" style="width:96px;height:96px;background:#3b82f6;left:-40px;top:44px"></div>
      <div class="marble" style="width:70px;height:70px;background:#22c55e;right:-18px;top:150px"></div>
      <div class="marble" style="width:58px;height:58px;background:#ec4899;left:30px;bottom:30px"></div>
      <div class="marble" style="width:84px;height:84px;background:#f97316;right:40px;bottom:-14px"></div>
    </div>
  </div>
</body>
</html>

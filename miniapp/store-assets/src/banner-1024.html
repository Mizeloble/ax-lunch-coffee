<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  /* 원스토어 1024×578 (16:9) 슬롯용 배너 */
  html,body{margin:0;padding:0}
  body{width:1024px;height:578px;overflow:hidden;position:relative;
    font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    background:
      radial-gradient(60% 80% at 78% 30%, rgba(251,191,36,.16), transparent 60%),
      radial-gradient(50% 70% at 12% 90%, rgba(239,68,68,.12), transparent 65%),
      radial-gradient(130% 100% at 50% 0%, #191922 0%, #0b0b10 62%) #0b0b10;
    color:#f5f5f5;letter-spacing:-0.03em}
  .wrap{position:absolute;inset:0;display:flex;align-items:center;gap:52px;padding:0 68px}
  .left{flex:1;min-width:0}
  h1{margin:0;font-size:92px;font-weight:800;line-height:1.06;letter-spacing:-0.05em}
  h1 .accent{color:#fbbf24}
  p.tag{margin:22px 0 0;font-size:32px;color:#c9c9d4;font-weight:600}
  .chips{display:flex;gap:13px;margin-top:34px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:9px;padding:11px 21px;border-radius:999px;
    background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);
    font-size:23px;font-weight:700;color:#e8e8ef;white-space:nowrap}
  .art{position:relative;width:330px;height:330px;flex:none}
  .art svg.target{position:absolute;inset:0}
  .marble{position:absolute;border-radius:50%;
    box-shadow:inset -5px -6px 10px rgba(0,0,0,.35), inset 4px 5px 8px rgba(255,255,255,.25), 0 11px 18px rgba(0,0,0,.45)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <h1>복불복<span class="accent">파티</span></h1>
      <p class="tag">모여서 바로 즐기는 복불복 미니게임</p>
      <div class="chips">
        <span class="chip">🏁 마블 레이스</span>
        <span class="chip">⚡ 반응속도</span>
        <span class="chip">🧠 상식 퀴즈</span>
        <span class="chip">+5</span>
      </div>
    </div>
    <div class="art">
      <svg class="target" width="330" height="330" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="11" fill="none" stroke="#ef4444" stroke-width="3"/>
        <circle cx="16" cy="16" r="6" fill="none" stroke="#fbbf24" stroke-width="3"/>
        <circle cx="16" cy="16" r="1.8" fill="#fbbf24"/>
      </svg>
      <div class="marble" style="width:58px;height:58px;background:#3b82f6;left:-24px;top:26px"></div>
      <div class="marble" style="width:42px;height:42px;background:#22c55e;right:-11px;top:90px"></div>
      <div class="marble" style="width:35px;height:35px;background:#ec4899;left:18px;bottom:18px"></div>
      <div class="marble" style="width:50px;height:50px;background:#f97316;right:24px;bottom:-8px"></div>
    </div>
  </div>
</body>
</html>

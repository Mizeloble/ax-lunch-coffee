<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  /* 앱인토스 앱 로고 600×600 — 둥근 모서리 금지(콘솔이 마스킹), 투명 배경 금지 */
  html,body{margin:0;padding:0}
  body{width:600px;height:600px;overflow:hidden;
    background:
      radial-gradient(75% 55% at 50% 8%, rgba(251,191,36,.14), transparent 62%),
      radial-gradient(120% 90% at 50% 0%, #171720 0%, #0b0b10 60%) #0b0b10;
    display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
  <svg width="430" height="430" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <circle cx="16" cy="16" r="11" fill="none" stroke="#ef4444" stroke-width="3"/>
    <circle cx="16" cy="16" r="6" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="16" cy="16" r="1.8" fill="#fbbf24"/>
  </svg>
</body>
</html>
